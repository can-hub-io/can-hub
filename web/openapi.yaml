openapi: 3.1.0
info:
  title: can-hub-web REST API
  version: 0.5.1
  description: >
    REST API of the `can-hub-web` admin daemon. The daemon is a local admin
    client of the hub unix socket and an HTTP server towards browsers; this is
    the contract the React SPA and the end-to-end suite consume.

    Authentication is a server-side session over an HttpOnly cookie
    (`canhub_session`). Mutating requests (POST/PUT/DELETE/PATCH) additionally
    require the session CSRF token in the `X-CSRF-Token` header; the token is
    returned by `/api/auth/state`, `/api/login` and `/api/setup`. Each route
    family is gated by an operation-class permission (see `Permission`).

    This document is hand-maintained; it is the authoritative base for the
    web <-> can-hub end-to-end tests. Keep it in sync with `web/daemon/src/api`.

servers:
  - url: http://127.0.0.1:8080
    description: Default local bind (front with a TLS reverse proxy in production)

tags:
  - name: auth
    description: Login, logout, bootstrap, session state, self-service password
  - name: views
    description: Read-only views mirroring the hub admin replies (views.read)
  - name: actions
    description: Mutating admin actions (per-class permissions)
  - name: management
    description: User/group/permission/audit management (users.manage)
  - name: health
    description: Liveness

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Always "ok"
          content:
            text/plain:
              schema: { type: string, example: ok }

  /api/auth/state:
    get:
      tags: [auth]
      summary: Current auth state
      description: >
        Public. Reports whether first-run bootstrap is needed, whether the
        caller is authenticated, and (when authenticated) the user, effective
        permissions and CSRF token. The UI calls this on load.
      security: []
      responses:
        '200':
          description: Auth state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthState' }

  /api/login:
    post:
      tags: [auth]
      summary: Log in
      description: >
        Public. On success sets the `canhub_session` cookie and returns the
        auth state with a fresh CSRF token. Rate limited per client address and
        per attempted user name.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              schema: { type: string }
              description: canhub_session=<token>; HttpOnly; SameSite=Strict; Path=/
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthState' }
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/logout:
    post:
      tags: [auth]
      summary: Log out
      description: Public. Deletes the current session and clears the cookie.
      security: []
      responses:
        '200':
          description: Logged out
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Expires the session cookie (Max-Age=0)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }

  /api/setup:
    post:
      tags: [auth]
      summary: First-run bootstrap
      description: >
        Public, but only succeeds while there are zero users. Creates the first
        admin (in an `admins` group holding every permission) and logs them in.
        Returns 409 once setup has completed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Bootstrap admin created and logged in
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthState' }
        '409':
          $ref: '#/components/responses/Conflict'

  /api/auth/password:
    post:
      tags: [auth]
      summary: Change own password (self-service)
      description: >
        Any authenticated user. Confirms the current password, then sets the new
        one and invalidates the user's other sessions (the current one is kept).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelfPassword' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/status:
    get:
      tags: [views]
      summary: Hub counters
      description: 'Permission: views.read'
      responses:
        '200':
          description: Hub status snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/peers:
    get:
      tags: [views]
      summary: Live peer table
      description: 'Permission: views.read. Aggregates the paginated hub reply.'
      responses:
        '200':
          description: Peers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Peer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/agents:
    get:
      tags: [views]
      summary: Registered agents
      description: 'Permission: views.read'
      responses:
        '200':
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/clients:
    get:
      tags: [views]
      summary: Connected clients and their open channels
      description: 'Permission: views.read'
      responses:
        '200':
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/interfaces:
    get:
      tags: [views]
      summary: Interface catalogue with counters
      description: 'Permission: views.read'
      responses:
        '200':
          description: Interfaces
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Interface' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/telemetry/ws:
    get:
      tags: [views]
      summary: Real-time telemetry (WebSocket)
      description: >
        Permission: views.read. Upgrades to a WebSocket. The server pushes one
        `TelemetryFrame` JSON message per poll interval (~1 s). HTTP semantics
        below describe the upgrade handshake only.
      responses:
        '101':
          description: Switching Protocols (WebSocket). Frames match TelemetryFrame.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/peers/{id}/kick:
    post:
      tags: [actions]
      summary: Disconnect a peer
      description: 'Permission: peers.kick'
      parameters:
        - name: id
          in: path
          required: true
          description: Peer id, decimal or 0x-prefixed hex.
          schema: { type: string, example: '0x80000001' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/HubRejected' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/agents/{name}/kick:
    post:
      tags: [actions]
      summary: Disconnect an agent by name
      description: 'Permission: peers.kick'
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/HubRejected' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/interfaces/{agent}/{interface}/settings:
    get:
      tags: [views]
      summary: The settings an interface holds now, read from its agent
      description: 'Permission: views.read'
      parameters:
        - { name: agent, in: path, required: true, schema: { type: string } }
        - { name: interface, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Settings the device reports
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterfaceSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/interfaces/config:
    post:
      tags: [actions]
      summary: Reconfigure an interface, every given setting in one step
      description: >
        Permission: interfaces.config. Only the settings present change. A
        bitrate must be 1..=1000000 (classic CAN nominal rate); 0 or out of
        range is rejected with 400. Bit timing, modes and restart-ms take the
        bus down while they are applied. A refusal from the agent comes back
        as 409 with the kernel's reason in the error text.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterfaceConfigBody' }
      responses:
        '200':
          description: Settings the device holds afterwards
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterfaceSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/HubRejected' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/pins:
    get:
      tags: [actions]
      summary: List pinned agent identities
      description: 'Permission: pins.manage'
      responses:
        '200':
          description: Pins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/HubUnreachable' }
    post:
      tags: [actions]
      summary: Authorize (pin) an agent fingerprint
      description: 'Permission: pins.manage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PinAddBody' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/HubRejected' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/pins/{name}:
    delete:
      tags: [actions]
      summary: Drop a pinned identity by agent name
      description: 'Permission: pins.manage'
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/HubRejected' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/rejected:
    get:
      tags: [actions]
      summary: List the identities the hub turned away
      description: >-
        Agents and clients rejected by a hub locked to known peers, and agents
        whose name is pinned to another fingerprint. One entry per fingerprint
        and role, in memory on the hub; an admitted identity drops out.
        Permission: pins.manage
      responses:
        '200':
          description: Rejected identities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rejected' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/acls:
    get:
      tags: [actions]
      summary: List client ACL grants
      description: 'Permission: acl.manage'
      responses:
        '200':
          description: ACL grants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Acl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/HubUnreachable' }
    post:
      tags: [actions]
      summary: Grant a client read/write on an interface
      description: 'Permission: acl.manage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AclBody' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/HubRejected' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/acls/revoke:
    post:
      tags: [actions]
      summary: Drop a client grant
      description: 'Permission: acl.manage. The level field is ignored.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AclBody' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/HubRejected' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/bridges:
    get:
      tags: [actions]
      summary: List bus-to-bus routes with their counters
      description: 'Permission: bridges.manage'
      responses:
        '200':
          description: Bridge routes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Bridge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/HubUnreachable' }
    post:
      tags: [actions]
      summary: Bridge one bus into another
      description: >-
        Permission: bridges.manage. Frames captured on the source that pass the
        filters (none = all) are injected into the destination. Setting a route
        again replaces its filters. 400 when both ends are the same bus, 409
        when the hub holds no more routes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BridgeBody' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/HubRejected' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/bridges/delete:
    post:
      tags: [actions]
      summary: Drop a bus-to-bus route
      description: 'Permission: bridges.manage. 404 when there is no such route.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BridgeDeleteBody' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/bridge-groups:
    get:
      tags: [actions]
      summary: List bridge groups with their members and counters
      description: 'Permission: bridges.manage'
      responses:
        '200':
          description: Bridge groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BridgeGroup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/HubUnreachable' }
    post:
      tags: [actions]
      summary: Create a bridge group, or replace its filters
      description: >-
        Permission: bridges.manage. A frame captured on a member that passes
        the filters (none = all) is injected into every other member. Members
        are kept when the group exists. 400 for a bad name (1-15 of
        A-Z a-z 0-9 . _ -), 409 when the hub holds no more groups.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BridgeGroupBody' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/HubRejected' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/bridge-groups/delete:
    post:
      tags: [actions]
      summary: Drop a bridge group
      description: 'Permission: bridges.manage. 404 when there is no such group.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BridgeGroupNameBody' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/bridge-groups/members:
    post:
      tags: [actions]
      summary: Add a bus to a bridge group, or update its direction and ids
      description: 'Permission: bridges.manage. 404 for an unknown group, 409 when it already has 16 members.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BridgeGroupMemberBody' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/HubRejected' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/bridge-groups/members/delete:
    post:
      tags: [actions]
      summary: Remove a bus from a bridge group
      description: 'Permission: bridges.manage. 404 when the group or the member is unknown.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BridgeGroupMemberBody' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/HubUnreachable' }

  /api/audit:
    get:
      tags: [management]
      summary: Recent audit log (newest first, up to 200)
      description: 'Permission: users.manage'
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/permissions:
    get:
      tags: [management]
      summary: All assignable permission names
      description: 'Permission: users.manage'
      responses:
        '200':
          description: Permission names
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Permission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/users:
    get:
      tags: [management]
      summary: List users
      description: 'Permission: users.manage'
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ManagedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [management]
      summary: Create a user
      description: 'Permission: users.manage. Password min length 8.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserBody' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/users/{id}:
    delete:
      tags: [management]
      summary: Delete a user
      description: >
        Permission: users.manage. Refuses to delete the requesting user or the
        last enabled holder of users.manage (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/users/{id}/enabled:
    post:
      tags: [management]
      summary: Enable or disable a user
      description: >
        Permission: users.manage. Disabling refuses to target the requesting
        user or the last enabled holder of users.manage (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnabledBody' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/users/{id}/password:
    post:
      tags: [management]
      summary: Reset a user's password (admin)
      description: >
        Permission: users.manage. Sets a new password and drops all of that
        user's sessions, forcing re-login. Password min length 8.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordBody' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/users/{id}/groups:
    post:
      tags: [management]
      summary: Add a user to a group
      description: 'Permission: users.manage'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipBody' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/users/{id}/groups/{groupId}:
    delete:
      tags: [management]
      summary: Remove a user from a group
      description: 'Permission: users.manage'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: groupId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/groups:
    get:
      tags: [management]
      summary: List groups with their permissions
      description: 'Permission: users.manage'
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ManagedGroup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [management]
      summary: Create a group
      description: 'Permission: users.manage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameBody' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/groups/{id}:
    delete:
      tags: [management]
      summary: Delete a group
      description: >
        Permission: users.manage. Refuses the change if it would leave zero
        enabled holders of users.manage (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/groups/{id}/permissions:
    put:
      tags: [management]
      summary: Replace a group's permission set
      description: >
        Permission: users.manage. Refuses the change if it would leave zero
        enabled holders of users.manage (409). Unknown permission name -> 400.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionsBody' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: canhub_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token

  responses:
    Action:
      description: Action accepted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ActionResult' }
    BadRequest:
      description: Malformed or invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthorized:
      description: No valid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Forbidden:
      description: Authenticated but missing the required permission, or bad/missing CSRF token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Conflict:
      description: Precondition violated (name taken, setup done, anti-lockout, no such user)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    TooManyRequests:
      description: Login rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    InvalidCredentials:
      description: Unknown user, wrong password, or disabled account
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    HubRejected:
      description: The hub processed the request but returned a non-zero status
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: The hub knows no such interface
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    HubUnreachable:
      description: The hub admin socket is unreachable or timed out
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Permission:
      type: string
      enum: [views.read, peers.kick, interfaces.config, pins.manage, acl.manage, bridges.manage, users.manage]

    AclLevel:
      type: string
      description: rwa adds configuring the interface to read and write.
      enum: [none, r, rw, rwa]

    CanModes:
      type: object
      description: Control modes by name; in a change, only the modes to set.
      properties:
        fd: { type: boolean }
        listenOnly: { type: boolean }
        loopback: { type: boolean }
        oneShot: { type: boolean }
        tripleSampling: { type: boolean }
        berrReporting: { type: boolean }
      additionalProperties: false

    BitTiming:
      type: object
      description: >
        Raw bit timing, the alternative to a bitrate: tq in ns, segments in
        quanta. In a change every member is optional; sjw alone may go with a
        bitrate. A reply carries every member, as the kernel settled them.
      additionalProperties: false
      properties:
        tq: { type: integer, format: uint32 }
        propSeg: { type: integer, format: uint32 }
        phaseSeg1: { type: integer, format: uint32 }
        phaseSeg2: { type: integer, format: uint32 }
        sjw: { type: integer, format: uint32 }
        brp: { type: integer, format: uint32 }

    InterfaceSettings:
      type: object
      description: >
        What the device reports. A key is absent when the device reports
        nothing for it (a vcan has no bit timing). Sample points are fractions.
      required: [modes]
      properties:
        up: { type: boolean }
        state:
          type: string
          enum: [error-active, error-warning, error-passive, bus-off, stopped, sleeping, unknown]
        bitrate: { type: integer, format: uint32 }
        samplePoint: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }
        dataBitrate: { type: integer, format: uint32 }
        dataSamplePoint: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }
        restartMs: { type: integer, format: uint32 }
        txqueuelen: { type: integer, format: uint32 }
        termination: { type: integer, format: uint16, description: 'ohms, 0 = off' }
        bitTiming: { $ref: '#/components/schemas/BitTiming' }
        dataBitTiming: { $ref: '#/components/schemas/BitTiming' }
        modes: { $ref: '#/components/schemas/CanModes' }

    InterfaceSettingsChange:
      type: object
      description: What to change; at least one key. Absent keys are left as they are.
      additionalProperties: false
      properties:
        up: { type: boolean }
        bitrate: { type: integer, format: uint32, minimum: 1, maximum: 1000000 }
        samplePoint: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }
        dataBitrate: { type: integer, format: uint32 }
        dataSamplePoint: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }
        restartMs: { type: integer, format: uint32 }
        txqueuelen: { type: integer, format: uint32 }
        termination: { type: integer, format: uint16, minimum: 0, maximum: 65535 }
        bitTiming: { $ref: '#/components/schemas/BitTiming' }
        dataBitTiming: { $ref: '#/components/schemas/BitTiming' }
        modes: { $ref: '#/components/schemas/CanModes' }

    ActionResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    AuthState:
      type: object
      required: [needsBootstrap, authenticated, user, permissions, csrfToken]
      properties:
        needsBootstrap: { type: boolean }
        authenticated: { type: boolean }
        user: { type: [string, 'null'] }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        csrfToken: { type: [string, 'null'] }

    Credentials:
      type: object
      required: [name, password]
      properties:
        name: { type: string }
        password: { type: string }

    SelfPassword:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8 }

    Status:
      type: object
      required:
        [peerCount, agentCount, clientCount, interfaceCount, receiveOverflows,
         framesReceived, framesForwarded, framesDropped, framesUnroutable]
      properties:
        peerCount: { type: integer, format: uint16 }
        agentCount: { type: integer, format: uint16 }
        clientCount: { type: integer, format: uint16 }
        interfaceCount: { type: integer, format: uint16 }
        receiveOverflows: { type: integer, format: uint32 }
        framesReceived: { type: integer, format: uint64 }
        framesForwarded: { type: integer, format: uint64 }
        framesDropped: { type: integer, format: uint64 }
        framesUnroutable: { type: integer, format: uint64 }

    Peer:
      type: object
      required: [peerId, role, transport, agentName, origin, fingerprintHex, uptimeSeconds, framesForwarded, framesDropped]
      properties:
        peerId: { type: integer, format: uint32 }
        role: { type: string, enum: [agent, client, admin, unknown] }
        transport: { type: string, enum: [unix, tcp, tls, quic, unknown] }
        agentName: { type: string }
        origin: { type: string }
        fingerprintHex: { type: string }
        uptimeSeconds: { type: integer, format: uint32 }
        framesForwarded: { type: integer, format: uint32 }
        framesDropped: { type: integer, format: uint32 }

    Agent:
      type: object
      required: [peerId, interfaceCount, agentName, fingerprintHex]
      properties:
        peerId: { type: integer, format: uint32 }
        interfaceCount: { type: integer, format: uint8 }
        agentName: { type: string }
        fingerprintHex: { type: string }

    Client:
      type: object
      required:
        [peerId, interfaceId, channel, agentName, interfaceName, framesForwarded, framesDropped]
      properties:
        peerId: { type: integer, format: uint32 }
        interfaceId: { type: integer, format: uint32 }
        channel:
          type: [integer, 'null']
          format: uint8
          description: Open data-plane channel, or null when the client holds none.
        agentName: { type: string }
        interfaceName: { type: string }
        framesForwarded: { type: integer, format: uint32 }
        framesDropped: { type: integer, format: uint32 }

    Interface:
      type: object
      required: [interfaceId, subscriberCount, mode, framesReceived, txDropped, agentName, interfaceName]
      properties:
        mode: { type: string, enum: [unknown, classic, fd], description: 'CAN FD as the agent reports it; a classic interface gets no FD frames from the hub' }
        interfaceId: { type: integer, format: uint32 }
        subscriberCount: { type: integer, format: uint8 }
        framesReceived: { type: integer, format: uint64 }
        txDropped: { type: integer, format: uint64 }
        agentName: { type: string }
        interfaceName: { type: string }

    Acl:
      type: object
      required: [fingerprintHex, agentName, interfaceName, level]
      properties:
        fingerprintHex: { type: string }
        agentName: { type: string }
        interfaceName: { type: string }
        level: { $ref: '#/components/schemas/AclLevel' }

    BridgeEndpoint:
      type: object
      required: [agentName, interfaceName]
      properties:
        agentName: { type: string }
        interfaceName: { type: string }

    CanFilter:
      type: object
      required: [canId, canMask]
      description: A frame passes when id & canMask == canId & canMask.
      properties:
        canId: { type: integer, format: int32 }
        canMask: { type: integer, format: int32 }

    Bridge:
      type: object
      required: [source, destination, filters, sourceOnline, destinationOnline, forwarded, dropped]
      properties:
        source: { $ref: '#/components/schemas/BridgeEndpoint' }
        destination: { $ref: '#/components/schemas/BridgeEndpoint' }
        filters:
          type: array
          items: { $ref: '#/components/schemas/CanFilter' }
        sourceOnline: { type: boolean }
        destinationOnline: { type: boolean }
        forwarded: { type: integer, format: int64 }
        dropped: { type: integer, format: int64, description: 'Frames for a destination that was offline' }

    BridgeBody:
      type: object
      required: [source, destination]
      properties:
        source: { $ref: '#/components/schemas/BridgeEndpoint' }
        destination: { $ref: '#/components/schemas/BridgeEndpoint' }
        filters:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/CanFilter' }

    BridgeDeleteBody:
      type: object
      required: [source, destination]
      properties:
        source: { $ref: '#/components/schemas/BridgeEndpoint' }
        destination: { $ref: '#/components/schemas/BridgeEndpoint' }

    BridgeGroupMember:
      type: object
      required: [agentName, interfaceName, online, direction, filters]
      properties:
        agentName: { type: string }
        interfaceName: { type: string }
        online: { type: boolean }
        direction: { type: string, enum: [both, sends, receives] }
        filters:
          type: array
          description: What the member sends into the group (none = all)
          items: { $ref: '#/components/schemas/CanFilter' }

    BridgeGroup:
      type: object
      required: [name, filters, members, forwarded, dropped]
      properties:
        name: { type: string }
        filters:
          type: array
          items: { $ref: '#/components/schemas/CanFilter' }
        members:
          type: array
          items: { $ref: '#/components/schemas/BridgeGroupMember' }
        forwarded: { type: integer, format: int64 }
        dropped: { type: integer, format: int64, description: 'Frames for a member that was offline' }

    BridgeGroupBody:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9._-]{1,15}$' }
        filters:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/CanFilter' }

    BridgeGroupNameBody:
      type: object
      required: [name]
      properties:
        name: { type: string }

    BridgeGroupMemberBody:
      type: object
      required: [name, member]
      properties:
        name: { type: string }
        member: { $ref: '#/components/schemas/BridgeEndpoint' }
        direction:
          type: string
          enum: [both, sends, receives]
          description: 'Default both: sends only feeds the group, receives only gets it. Ignored on removal.'
        filters:
          type: array
          maxItems: 8
          description: What the member sends into the group (none = all). Ignored on removal.
          items: { $ref: '#/components/schemas/CanFilter' }

    Pin:
      type: object
      required: [agentName, fingerprintHex]
      properties:
        agentName: { type: string }
        fingerprintHex: { type: string }

    Rejected:
      type: object
      required: [role, reason, attempts, lastSeenSeconds, name, fingerprintHex, origin]
      properties:
        role: { type: string, enum: [agent, client] }
        reason: { type: string, enum: [not-allowed, fingerprint-mismatch] }
        attempts: { type: integer }
        lastSeenSeconds: { type: integer }
        name: { type: string, description: 'agent name claimed at REGISTER, or the client HELLO label' }
        fingerprintHex: { type: string }
        origin: { type: string, description: 'remote ip:port of the last attempt' }

    ManagedUser:
      type: object
      required: [id, name, enabled, groupIds]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        enabled: { type: boolean }
        groupIds:
          type: array
          items: { type: integer, format: int64 }

    ManagedGroup:
      type: object
      required: [id, name, permissions]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }

    AuditEntry:
      type: object
      required: [at, actor, action, target, status]
      properties:
        at: { type: integer, format: int64, description: Unix epoch seconds }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        status: { type: integer, format: uint16, description: HTTP status the request produced }

    PinAddBody:
      type: object
      required: [agentName, fingerprintHex]
      properties:
        agentName: { type: string }
        fingerprintHex: { type: string, description: sha256 hex }

    AclBody:
      type: object
      required: [fingerprintHex, agentName, interfaceName]
      properties:
        fingerprintHex: { type: string, description: subject fingerprint, or '*' }
        agentName: { type: string, description: object agent, or '*' }
        interfaceName: { type: string, description: object interface, or '*' }
        level:
          allOf: [{ $ref: '#/components/schemas/AclLevel' }]
          description: Required for grant; ignored by revoke.

    InterfaceConfigBody:
      type: object
      required: [agentName, interfaceName, settings]
      properties:
        agentName: { type: string }
        interfaceName: { type: string }
        settings: { $ref: '#/components/schemas/InterfaceSettingsChange' }

    CreateUserBody:
      type: object
      required: [name, password]
      properties:
        name: { type: string }
        password: { type: string, minLength: 8 }
        enabled: { type: boolean, default: true }

    EnabledBody:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    NameBody:
      type: object
      required: [name]
      properties:
        name: { type: string }

    MembershipBody:
      type: object
      required: [groupId]
      properties:
        groupId: { type: integer, format: int64 }

    PermissionsBody:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }

    PasswordBody:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8 }

    TelemetryFrame:
      type: object
      description: One WebSocket telemetry message (absolute counters + rates since the last sample).
      required: [received, forwarded, dropped, unroutable, rates, interfaces, transactions, transactionsInFlight]
      properties:
        received: { type: integer, format: uint64 }
        forwarded: { type: integer, format: uint64 }
        dropped: { type: integer, format: uint64 }
        unroutable: { type: integer, format: uint64 }
        rates:
          type: object
          required: [receivedPerS, forwardedPerS, droppedPerS, unroutablePerS]
          properties:
            receivedPerS: { type: number, format: double }
            forwardedPerS: { type: number, format: double }
            droppedPerS: { type: number, format: double }
            unroutablePerS: { type: number, format: double }
        interfaces:
          type: array
          items:
            type: object
            required: [interfaceId, agentName, interfaceName, framesReceived, framesPerS]
            properties:
              interfaceId: { type: integer, format: uint32 }
              agentName: { type: string }
              interfaceName: { type: string }
              framesReceived: { type: integer, format: uint64 }
              framesPerS: { type: number, format: double }
        transactions:
          type: object
          description: >-
            Transactions now running, the steps they complete per second (finished
            transactions plus the progress of running ones), the share of finished
            transactions that ended done (null before any finished), and the client
            frames dropped because another client held the lease.
          required: [active, stepsPerS, successRatio, leaseDrops]
          properties:
            active: { type: integer, format: uint32 }
            stepsPerS: { type: number, format: double }
            successRatio: { type: number, format: double, nullable: true }
            leaseDrops: { type: integer, format: uint64 }
        transactionsInFlight:
          type: array
          items:
            type: object
            required: [interface, clientPeerId, clientName, state, exclusive, completedSteps, bytesInFlight, ageMs, progressAgeMs]
            properties:
              interface: { type: string, description: agent/iface }
              clientPeerId: { type: integer, format: uint32, description: 0 once the client left }
              clientName: { type: string, nullable: true }
              state: { type: string, enum: [pending, active] }
              exclusive: { type: boolean }
              completedSteps: { type: integer, format: uint32 }
              bytesInFlight: { type: integer, format: uint32 }
              ageMs: { type: integer, format: uint32 }
              progressAgeMs: { type: integer, format: uint32, nullable: true }

security:
  - cookieAuth: []
  - cookieAuth: []
    csrfToken: []
