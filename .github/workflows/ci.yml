name: ci

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same ref are cancelled; a new push to a branch stops
# the in-flight CI instead of running it to completion alongside the new one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: cache build trees
        uses: actions/cache@v4
        with:
          path: build
          key: x86_64-${{ hashFiles('CMakeLists.txt', 'test/CMakeLists.txt', 'cmake/**') }}
      - name: unit tests
        run: make test
      - name: release build
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: can-hub-x86_64
          path: build/x86_64/release/can-hub*
          retention-days: 7

  # `make test` builds our sources plain: the cest runner is an ASan binary, but
  # that watches the runner's allocations, not ours.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: sanitized-${{ hashFiles('CMakeLists.txt', 'test/CMakeLists.txt', 'cmake/**') }}
      - name: unit tests under asan and ubsan
        run: make test-sanitized

  # Installed the way it ships, library bundled into canhub/, so the suite runs
  # against what a user gets rather than a path in an environment variable.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: build and bundle libcanhub
        run: |
          make release
          cp build/x86_64/release/libcanhub.so.0 python/canhub/libcanhub.so
      - name: install the package and its test extra
        run: python3 -m pip install --break-system-packages "./python[test]"
      - name: pytest
        working-directory: python
        run: python3 -m pytest

  cross-armhf:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: |
          sudo dpkg --add-architecture armhf
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
      - name: cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: armhf-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
      - name: release build
        run: make release ARCH=armhf
      # ARMv8-A defines the crypto extensions in AArch32 too, and this runner
      # implements that state. Informational: a runner that does not answers
      # with "Exec format error", which must not fail the build.
      - name: armv7 aead agreement, if this core runs 32-bit
        continue-on-error: true
        run: |
          grep -m1 'model name\|CPU part' /proc/cpuinfo || true
          make -C spike/aead-bench \
              CC=arm-linux-gnueabihf-gcc \
              CFLAGS="-O2 -Wall -Wextra -static" \
              BUILD="$PWD/build/armhf/release" FUSION=0 ARMV8=1
          ./spike/aead-bench/aead_bench || echo "this core does not run AArch32"
      # Same core and execution state, so the comparison isolates the stack.
      # Extracted rather than installed: openssl is Multi-Arch foreign, so apt
      # would replace the runner's own arm64 build.
      - name: armv7 against the openssl v0.3.0 shipped with
        continue-on-error: true
        run: |
          mkdir -p /tmp/ossl && cd /tmp/ossl
          apt-get download openssl:armhf libssl3t64:armhf libc6:armhf 2>/dev/null \
            || apt-get download openssl:armhf libssl3:armhf libc6:armhf
          for package in *.deb; do dpkg -x "$package" root; done
          R=$PWD/root
          # Located rather than hardcoded: a merged-usr distribution ships the
          # loader under /usr/lib and a split one under /lib.
          loader=$(find "$R" -name 'ld-linux-armhf.so.3' -print -quit)
          libraries=$(find "$R" -name 'libc.so.6' -printf '%h\n' | tr '\n' ':')
          run_openssl() {
              "$loader" --library-path "$libraries" "$R/usr/bin/openssl" "$@"
          }
          run_openssl version
          echo "algorithm            bytes   us/op"
          for algorithm in chacha20-poly1305 aes-128-gcm aes-256-gcm; do
              for size in 40 1200; do
                  rate=$(run_openssl speed -elapsed -evp $algorithm -bytes $size 2>/dev/null \
                         | tail -1 | tr -s ' ' | cut -d' ' -f2 | tr -d 'k')
                  echo "$algorithm $size $rate" \
                    | awk '{printf "%-20s %5d %7.3f\n", $1, $2, $2 * 1000 / $3}'
              done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: can-hub-armhf
          path: build/armhf/release/can-hub*
          retention-days: 7

  # The static job also builds arm64 but runs on push only, so without this
  # job a change to the ARMv8 AES engine would reach main having been compiled
  # by nothing. cross-armhf covers the same engine in its AArch32 form.
  cross-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: arm64-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
      - name: release build
        run: make release ARCH=arm64
      # Timings from a shared runner are indicative (#193); agreement is not,
      # and agreement is what this gates.
      - name: arm64 aead agreement
        run: |
          grep -m1 'model name\|CPU part' /proc/cpuinfo || true
          make -C spike/aead-bench \
              CC=aarch64-linux-gnu-gcc \
              CFLAGS="-O2 -Wall -Wextra -static" \
              BUILD="$PWD/build/arm64/release" FUSION=0 ARMV8=1
          ./spike/aead-bench/aead_bench | tee agreement.txt
          if grep -qE '\bNO\b' agreement.txt; then
              echo "an engine disagrees with minicrypto"
              exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: can-hub-arm64
          path: build/arm64/release/can-hub*
          retention-days: 7

  windows-libcanhub:
    runs-on: ubuntu-latest
    env:
      LLVM_MINGW_VERSION: "20260602"
      LLVM_MINGW_SHA256: 9d191203f9768ead60662d3ae53cdf28e0a28b1e6d44b7f329b9202cb2add337
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: install llvm-mingw
        run: |
          curl -fsSL -o /tmp/llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64.tar.xz"
          echo "$LLVM_MINGW_SHA256  /tmp/llvm-mingw.tar.xz" | sha256sum -c
          mkdir -p "$HOME/llvm-mingw"
          tar -xf /tmp/llvm-mingw.tar.xz --strip-components=1 -C "$HOME/llvm-mingw"
      - name: cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: mingw-x86_64-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
      - name: windows build
        run: PATH="$HOME/llvm-mingw/bin:$PATH" make windows
      - name: win_amd64 wheel
        run: PATH="$HOME/llvm-mingw/bin:$PATH" ./scripts/build-python-wheel-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libcanhub-windows-x86_64
          path: |
            build/mingw-x86_64/release/libcanhub.dll
            build/mingw-x86_64/release/libcanhub.a
            build/mingw-x86_64/release/canhub-dump.exe
            python/dist/*.whl
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/daemon
      - name: daemon tests
        working-directory: web/daemon
        run: cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - name: ui install
        working-directory: web/ui
        run: npm ci
      - name: ui lint
        working-directory: web/ui
        run: npm run lint
      - name: ui build
        working-directory: web/ui
        run: npm run build

  static:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [armv7, arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: static build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/static.Dockerfile
          build-args: ARCH=${{ matrix.arch }}
          outputs: type=local,dest=dist/${{ matrix.arch }}
          cache-from: type=gha,scope=static-${{ matrix.arch }}
          cache-to: type=gha,scope=static-${{ matrix.arch }},mode=max
      - name: verify static linkage
        run: |
          file dist/${{ matrix.arch }}/can-hub-agent
          file dist/${{ matrix.arch }}/can-hub-agent | grep -q "statically linked"
      - name: lintian
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y lintian
          lintian --fail-on error dist/${{ matrix.arch }}/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: can-hub-static-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/can-hub*
          retention-days: 7

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build lintian
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/daemon
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - name: cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: deb-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
      - name: build per-binary debs
        run: make deb
      - name: lintian
        run: lintian --fail-on error build/x86_64/package/*.deb
